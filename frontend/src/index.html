<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Citra — AI Knowledge Assistant</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Ask questions about your documents and get answers with exact citations."
    />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="icon" href="favicon.ico" sizes="48x48" />
    <script>
      // Apply the saved (or OS) theme before Angular starts, so dark mode doesn't flash white on load.
      // Must match ThemeService (key 'citra-theme', class 'app-dark').
      (function () {
        try {
          var saved = localStorage.getItem('citra-theme');
          var dark = saved
            ? saved === 'dark'
            : window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (dark) document.documentElement.classList.add('app-dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
