<p-dialog
  header="Delete bot?"
  [(visible)]="visible"
  [modal]="true"
  [draggable]="false"
  [resizable]="false"
  [closeOnEscape]="!deleting()"
  [closable]="!deleting()"
  [style]="{ width: '30rem' }"
  [breakpoints]="{ '575px': '95vw' }"
>
  <form class="dialog-form" (ngSubmit)="confirm()" novalidate>
    <p class="warning">
      <i class="pi pi-exclamation-triangle" aria-hidden="true"></i>
      <span>
        This permanently deletes <strong>{{ bot().name }}</strong> with all its documents, chats and
        evaluations. The website widget stops working. This cannot be undone.
      </span>
    </p>

    @if (errorMessage(); as message) {
      <p-message severity="error" [text]="message" />
    }

    <div class="field">
      <label for="confirm-name">
        Type <strong class="bot-name">{{ bot().name }}</strong> to confirm
      </label>
      <input
        pInputText
        id="confirm-name"
        name="confirmName"
        autocomplete="off"
        [ngModel]="typedName()"
        (ngModelChange)="typedName.set($event)"
        [disabled]="deleting()"
        fluid
      />
    </div>
  </form>

  <ng-template #footer>
    <p-button
      label="Cancel"
      severity="secondary"
      [text]="true"
      [disabled]="deleting()"
      (onClick)="cancel()"
    />
    <p-button
      label="Delete bot"
      icon="pi pi-trash"
      severity="danger"
      [disabled]="!confirmed()"
      [loading]="deleting()"
      (onClick)="confirm()"
    />
  </ng-template>
</p-dialog>
