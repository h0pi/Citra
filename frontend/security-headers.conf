# Security headers for the admin app (included by nginx.conf in each location that serves it; nginx drops
# inherited add_header lines in a location that has its own).
#
# Content-Security-Policy: scripts only from this site, so injected HTML cannot run code or send the login tokens
# (kept in localStorage) elsewhere. 'wasm-unsafe-eval': the PDF viewer decodes some images with WebAssembly.
# Styles may be inline: Angular and PrimeNG add <style> elements while the app runs.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; frame-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
