# Serves the admin app and forwards the API's addresses to the api container (docker-compose.yml).

# SignalR (live document updates) upgrades its connection to a WebSocket.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Behind the host's HTTPS proxy, keep the scheme it reports; otherwise this connection's own.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 8080;
    root /usr/share/nginx/html;

    # Uploads up to the API's 20 MB limit (plus form overhead); the API itself enforces the real limit.
    client_max_body_size 25m;

    # API, live updates, health checks and the website widget script.
    location ~ ^/(api|hubs|health|widget\.js) {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # Chat answers stream word by word (server-sent events): pass each piece on at once.
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # The app's files have hashed names and never change; index.html must always be fresh.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Angular routes (/chat, /documents, ...) are all served by index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
