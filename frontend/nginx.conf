# Serves the admin app and forwards the API's addresses to the api container (docker-compose.yml).

# SignalR (live document updates) upgrades its connection to a WebSocket.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Behind the host's HTTPS proxy, keep the scheme it reports; otherwise this connection's own.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

# Access log without query strings: live updates (/hubs) carry the login token in the address.
log_format citra '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent '
                 '$request_time "$http_user_agent"';

# nginx's type list has no .mjs: pdf.js (the PDF viewer) loads its modules as .mjs, and browsers run modules only
# when they are served as JavaScript.
types {
    application/javascript mjs;
}

server {
    listen 8080;
    root /usr/share/nginx/html;
    access_log /var/log/nginx/access.log citra;

    # The visitor's real address. In front of nginx there may be one more proxy (Caddy on the server), on the
    # Docker network: its X-Forwarded-For is trusted, anyone else's is not. The API then gets exactly one address,
    # so its per-visitor rate limits and logs see the visitor, not the proxy.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;

    # Uploads up to the API's 20 MB limit (plus form overhead); the API itself enforces the real limit.
    client_max_body_size 25m;

    # API, live updates, health checks and the website widget script. The API sends its own security headers.
    location ~ ^/(api|hubs|health|widget\.js)(/|$) {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # Chat answers stream word by word (server-sent events): pass each piece on at once.
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # The app's files have hashed names and never change; index.html must always be fresh.
    location = /index.html {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # Angular routes (/chat, /documents, ...) are all served by index.html.
    location / {
        include /etc/nginx/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }
}
