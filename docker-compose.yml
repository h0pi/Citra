# The whole of Citra in one command:  docker compose up --build   →  http://localhost:8080
# Secrets come from a .env file next to this one (copy .env.example); none are built into the images.
# For development with live reload use docker-compose.dev.yml (database only) instead.
# Container logs are rotated (3 files of 10 MB each), so months of logs cannot fill the server's disk.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_DB: citra
      POSTGRES_USER: citra
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./deploy/db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U citra -d citra"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: src/Citra.Api/Dockerfile
    restart: unless-stopped
    logging: *logging
    environment: &backend
      # No Kerberos (GSS) encryption: not used, and its library is not in the slim images.
      ConnectionStrings__Database: Host=db;Port=5432;Database=citra;Username=citra;Password=${POSTGRES_PASSWORD};Gss Encryption Mode=Disable
      Voyage__ApiKey: ${VOYAGE_API_KEY:-}
      Anthropic__ApiKey: ${ANTHROPIC_API_KEY:-}
      Chat__Provider: ${CHAT_PROVIDER:-Extractive}
      Demo__TenantSlug: ${DEMO_TENANT_SLUG:-}
      Registration__Enabled: ${REGISTRATION_ENABLED:-true}
      Retention__ConversationDays: ${CONVERSATION_RETENTION_DAYS:-}
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?Set JWT_SIGNING_KEY in .env}
      # The only API: it brings the database schema up to date when it starts.
      Database__MigrateOnStartup: "true"
      # Requests arrive through nginx: trust its X-Forwarded-For/-Proto, so rate limits see the visitor's address
      # and HTTPS (HSTS) is recognised behind the host's proxy.
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
    volumes:
      - storage:/data/storage
    depends_on:
      db:
        condition: service_healthy

  worker:
    build:
      context: ./backend
      dockerfile: src/Citra.Worker/Dockerfile
    restart: unless-stopped
    logging: *logging
    environment: *backend
    volumes:
      - storage:/data/storage
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_started

  web:
    build: ./frontend
    restart: unless-stopped
    logging: *logging
    ports:
      - "${CITRA_PORT:-8080}:8080"
    depends_on:
      - api

volumes:
  db-data:
  # Uploaded files, shared by the API (stores them) and the Worker (reads them).
  storage:
