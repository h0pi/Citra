# Builds and tests everything on every push to main and every pull request.
# No secrets are needed: the tests use a throwaway PostgreSQL container (Testcontainers, Docker is on the runner)
# and fake AI services; the opt-in tests against the real Voyage API are skipped.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch cancels the run still going for the older one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (build + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore
      - run: dotnet build --no-restore -c Release
      - run: dotnet test --project tests/Citra.IntegrationTests --no-build -c Release

  frontend:
    name: Frontend (lint + tests + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # The npm named in package.json ("packageManager"): newer ones read the lock file differently.
      - run: npm install -g "$(node -p "require('./package.json').packageManager")"
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npx ng test --watch=false
      - run: npm run build

  widget:
    name: Widget (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: widget
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: widget/package-lock.json
      - run: npm ci
      - run: npm run build
      # The API serves the committed widget.js: it must be the build of the committed source.
      - name: Committed widget.js is up to date
        run: git diff --exit-code -- ../backend/src/Citra.Api/wwwroot/widget.js

  docker:
    name: Docker images (build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # The images the server runs (docker-compose.yml): they must still build after every change.
      - run: docker build -f backend/src/Citra.Api/Dockerfile backend
      - run: docker build -f backend/src/Citra.Worker/Dockerfile backend
      - run: docker build frontend
